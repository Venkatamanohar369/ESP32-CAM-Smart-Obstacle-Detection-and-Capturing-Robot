; PlatformIO Multi-Environment Configuration
; Option A Architecture: AI-Thinker ESP32-CAM + Arduino Nano (ATmega328P)

[platformio]
src_dir = firmware
default_envs = esp32cam, nanoatmega328

[env:esp32cam]
platform = espressif32 @ 6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<esp32cam/src/> -<nano/>
build_flags =
    -I firmware/shared/include
    -I firmware/esp32cam/include
    -I config
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CORE_DEBUG_LEVEL=1
board_build.partitions = huge_app.csv
lib_ldf_mode = deep+

[env:nanoatmega328]
platform = atmelavr @ 5.1.0
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = +<nano/src/> -<esp32cam/>
build_flags =
    -I firmware/shared/include
    -I firmware/nano/include
lib_deps =
    paulstoffregen/AltSoftSerial @ ^1.4

[env:nanoatmega328new]
extends = env:nanoatmega328
board = nanoatmega328new
